<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Primary Meta Tags -->
  <title>Lawrence Hsiung | Systems & Electrical Engineer</title>
  <meta name="title" content="Lawrence Hsiung | Systems & Electrical Engineer">
  <meta name="description" content="Lawrence Hsiung — Systems & Electrical Engineer @ Lucid Motors. Portfolio, concept vehicle electrical architectures, autonomous robotics, and analog film photography.">
  <meta name="keywords" content="Lawrence Hsiung, Electrical Engineer, Systems Engineer, Lucid Motors, Farmwise, Hardware Prototyping, Autonomous Robotics, Film Photography, Bauhaus">
  <meta name="author" content="Lawrence Hsiung">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://lawrencehsiung.github.io/lawrencejhsiung/">
  <meta property="og:title" content="Lawrence Hsiung | Systems & Electrical Engineer">
  <meta property="og:description" content="Prototypes and Concepts Systems Engineer @ Lucid Motors. Hardware prototyping, autonomous robotics, and film photography.">
  <meta property="og:image" content="assets/images/me.jpeg">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:title" content="Lawrence Hsiung | Systems & Electrical Engineer">
  <meta property="twitter:description" content="Prototypes and Concepts Systems Engineer @ Lucid Motors. Hardware prototyping, autonomous robotics, and film photography.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lawrence Hsiung">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #F7F7F4;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #F7F7F4;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    .bauhaus-loader {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }
    .shape {
      width: 28px;
      height: 28px;
      border: 2.5px solid #121214;
      box-shadow: 3px 3px 0px #121214;
      animation: pulse 1.2s infinite ease-in-out;
    }
    .circle {
      border-radius: 50%;
      background-color: #E63946;
      animation-delay: 0s;
    }
    .triangle {
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-bottom: 28px solid #E9C46A;
      border-top: none;
      box-shadow: none;
      filter: drop-shadow(3px 3px 0px #121214);
      animation-delay: 0.2s;
    }
    .square {
      background-color: #1D3557;
      animation-delay: 0.4s;
    }
    .loading-text {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #121214;
      text-transform: uppercase;
    }
    @keyframes pulse {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="bauhaus-loader">
      <div class="shape circle"></div>
      <div class="shape triangle"></div>
      <div class="shape square"></div>
    </div>
    <div class="loading-text">Lawrence Hsiung</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.remove();
        }, 400);
      }
    });
  </script>
</body>
</html>
